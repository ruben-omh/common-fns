  "@lazyconfig/cli": "0.2.0"
  "@lazyconfig/presets": "0.1.1"
  "@eslint/js": "10.0.1"
  "@microsoft/api-extractor": "7.59.4"
  "@rollup/plugin-babel": "7.1.0"
  "@rollup/plugin-node-resolve": "16.0.3"
  "@rollup/plugin-replace": "6.0.3"
  "@rollup/plugin-terser": "1.0.2"
  "@swc/core": "1.16.18"
  "@swc/jest": "0.2.39"
  "@types/jest": "30.0.0"
