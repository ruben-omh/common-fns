packages:
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  unrs-resolver: true

overrides:
  "glob@<10": "^10"

allowedDeprecatedVersions:
  glob: "*"

saveExact: true

saveWorkspaceProtocol: rolling

engineStrict: true

preferWorkspacePackages: true

linkWorkspacePackages: deep

fund: false

updateNotifier: false

minimumReleaseAgeStrict: true

catalog:
