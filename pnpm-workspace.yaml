packages:
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  unrs-resolver: true

overrides:
  "glob@<10": "^10"

allowedDeprecatedVersions:
  glob: "*"

saveExact: true

saveWorkspaceProtocol: rolling

engineStrict: true

preferWorkspacePackages: true

linkWorkspacePackages: deep

fund: false

updateNotifier: false

minimumReleaseAgeStrict: true

enablePrePostScripts: true

catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@babel/core": "8.1.2"
  "@babel/preset-env": "8.0.7"
  "@babel/preset-typescript": "8.0.7"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@commitlint/cli": "21.2.4"
  "@lazyconfig/cli": "0.2.1"
  "@lazyconfig/presets": "0.2.0"
  "@eslint/js": "10.0.1"
  "@microsoft/api-extractor": "7.60.1"
  "@rollup/plugin-babel": "7.1.0"
  "@rollup/plugin-node-resolve": "16.0.3"
  "@rollup/plugin-replace": "6.0.3"
  "@rollup/plugin-terser": "1.0.2"
  "@swc/core": "1.16.22"
  "@swc/jest": "0.2.39"
  "@types/jest": "30.0.0"
  "@types/node": "26.6.6"
  "babel-plugin-annotate-pure-calls": "0.5.0"
  "eslint": "10.15.0"
  "eslint-config-prettier": "10.1.8"
  "eslint-plugin-n": "18.5.0"
  "globals": "17.14.0"
  "husky": "9.1.7"
  "lint-staged": "17.6.2"
  "jest-environment-jsdom": "30.5.2"
  "jest": "30.5.2"
  "jest-junit": "17.0.0"
  "rimraf": "6.1.4"
  "prettier": "3.10.1"
  "rollup": "4.68.7"
  "turbo": "2.11.13"
  "typescript": "7.0.2"
  "typescript-eslint": "8.73.0"

minimumReleaseAgeExclude:
  - lint-staged@17.6.2
  - "@lazyconfig/cli@0.2.1"
  - "@lazyconfig/eslint@0.1.2"
  - "@lazyconfig/jest@0.2.1"
  - "@lazyconfig/presets@0.2.0"
  - "@lazyconfig/rollup@0.1.2"
